    "huggingface-hub>=0.23.0",
    "datasets>=2.19.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "decord>=0.6.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.9",
    "ffmpeg-python>=0.2.0",
    "openai>=1.30.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
